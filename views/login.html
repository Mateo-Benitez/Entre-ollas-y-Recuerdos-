<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Ingresar · Entre ollas y recuerdos</title>
  <link rel="icon" href="/img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/panel/admin.css">
</head>
<body class="login-page">
  <main class="login">
    <img src="/img/logo.svg" alt="" class="login__logo">
    <h1>Panel de administración</h1>
    <p class="muted">Ingresá con tu usuario y contraseña.</p>
    <form id="loginForm" novalidate>
      <label class="field"><span>Usuario</span>
        <input name="username" autocomplete="username" autocapitalize="none" required autofocus>
      </label>
      <label class="field"><span>Contraseña</span>
        <input name="password" type="password" autocomplete="current-password" required>
      </label>
      <p class="alert alert--error" id="err" role="alert" hidden></p>
      <button class="btn btn--primary btn--block" type="submit">Ingresar</button>
    </form>
    <a href="/" class="login__back">← Volver a la tienda</a>
  </main>
  <script src="/panel/login.js"></script>
</body>
</html>
